# sophialin-context dsh bundle layer (#949).
# Mounted automatically when the profile's package.json lists sophialin-context
# in dsh.profile.bundles (`dsh plugin --profile <name> add sophialin-context`);
# the loader resolves `name` from the profile's node_modules.
- insert:
    - id: sophialin-native
      name: sophialin-context
- id: compaction-basic
  config:
    auto: false
